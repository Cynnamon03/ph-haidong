<section class="py-20 bg-gray-50 relative">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="text-center mb-16">
      <h2 class="text-4xl font-black text-gray-900 tracking-tight uppercase">
        Latest <span class="text-amber-500">News</span>
      </h2>
      <div class="w-24 h-1 bg-amber-500 mx-auto mt-4"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
      @for (item of newsList; track item.title) {
        <div 
          (click)="openModal(item)"
          class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition-shadow duration-300 group cursor-pointer">
          <div class="h-56 bg-gray-300 overflow-hidden relative">
            <img [src]="item.image" [alt]="item.alt" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
          </div>
          <div class="p-8">
            <span class="text-xs font-bold text-amber-500 uppercase tracking-widest">{{ item.date }}</span>
            <h3 class="mt-3 text-xl font-bold text-gray-900 leading-tight group-hover:text-amber-500 transition-colors">
              {{ item.title }}
            </h3>
          </div>
        </div>
      }
    </div>
  </div>

  @if (selectedNews()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-white p-4 sm:p-12 overflow-y-auto">
      
      <button 
        (click)="closeModal()" 
        class="absolute top-6 right-6 z-30 p-2 text-gray-400 hover:text-black transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <button 
        (click)="prevNews()" 
        class="absolute left-4 md:left-10 top-1/2 -translate-y-1/2 z-30 p-2 text-gray-400 hover:text-black transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>

      <button 
        (click)="nextNews()" 
        class="absolute right-4 md:right-10 top-1/2 -translate-y-1/2 z-30 p-2 text-gray-400 hover:text-black transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </button>

      <div class="w-full max-w-7xl h-[80vh] flex flex-col md:flex-row items-center gap-10 md:gap-20 relative z-10">
        
        <div class="w-full md:w-3/5 h-1/2 md:h-full flex items-center justify-center relative">
          <img [src]="selectedNews().image" [alt]="selectedNews().alt" class="max-w-full max-h-full object-contain transition-all duration-300">
        </div>

        <div class="w-full md:w-2/5 flex flex-col justify-center text-left">
          
          <h3 class="text-4xl md:text-5xl text-gray-900 leading-tight font-bold mb-6 transition-all duration-300">
            {{ selectedNews().title }}
          </h3>
          
          <p class="text-xl md:text-2xl font-semibold text-gray-800 transition-all duration-300">
            {{ selectedNews().date }}
          </p>
          
          <p class="mt-8 text-lg md:text-xl font-medium text-gray-700 leading-relaxed transition-all duration-300">
            {{ selectedNews().description }}
          </p>

        </div>

      </div>
    </div>
  }
</section>
