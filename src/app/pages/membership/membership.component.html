<div class="bg-white min-h-screen pb-32">
  <section class="max-w-7xl mx-auto px-6 lg:px-12 py-24">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
      <div class="space-y-8">
        <h1 class="text-7xl font-black text-gray-900 uppercase tracking-tighter">Membership</h1>
        <p class="text-xl text-gray-600 leading-relaxed font-medium">
          Join our community and embark on a journey of self-discovery and mastery.
        </p>
        <div class="w-20 h-1.5 bg-amber-500"></div>
      </div>
      
      <div class="rounded-2xl overflow-hidden shadow-2xl border-b-8 border-amber-500">
        <img src="/images/Membership.jpg" 
             class="w-full h-auto grayscale hover:grayscale-0 transition-all duration-1000">
      </div>
    </div>
  </section>

  <section class="max-w-6xl mx-auto px-6 lg:px-12 py-16 border-t border-gray-100">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
      @for (app of applications; track app.title) {
        
        <a [href]="app.link" target="_blank" 
           class="flex items-start gap-6 p-8 rounded-2xl border border-transparent hover:border-gray-100 hover:shadow-xl hover:bg-gray-50 transition-all duration-300 group cursor-pointer">
          
          <div class="w-16 h-16 rounded-xl bg-gray-100 group-hover:bg-amber-100 flex items-center justify-center text-3xl text-gray-500 group-hover:text-amber-600 transition-colors shrink-0">
            <i class="bi" [ngClass]="app.icon"></i>
          </div>
          
          <div class="space-y-3">
            <h3 class="text-2xl font-black text-gray-900 group-hover:text-amber-500 transition-colors tracking-tight">
              {{ app.title }}
            </h3>
            
            <p class="text-gray-500 text-sm leading-relaxed font-medium">
              Download the official documentation required for your {{ app.title | lowercase }} processing.
            </p>
            
            <div class="inline-flex items-center gap-2 text-sm font-bold text-amber-600 uppercase tracking-widest mt-2">
              <i class="bi bi-file-earmark-arrow-down-fill text-lg"></i> 
              {{ app.label }}
            </div>
          </div>
        </a>
        
      }
    </div>
  </section>
</div>
