<div class="bg-white min-h-screen">
  <section class="py-20 bg-gray-50 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <h2 class="text-4xl font-black uppercase text-gray-900 tracking-tight">
        Our <span class="text-amber-500">Organization</span>
      </h2>
      <div class="w-24 h-1 bg-amber-500 mx-auto mt-4"></div>
    </div>
  </section>

  <section class="py-24 space-y-32">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <div class="flex flex-col md:flex-row items-center gap-16 mb-32">
        <div class="w-full md:w-1/2">
          <div class="relative shadow-2xl rounded-lg overflow-hidden border-b-8 border-amber-500">
            <img [src]="founder.image" [alt]="founder.name" class="w-full h-[500px] object-cover">
          </div>
        </div>
        <div class="w-full md:w-1/2">
          <h4 class="text-amber-500 text-3xl font-light mb-2">President <span class="font-bold text-gray-900">{{ founder.name }}</span></h4>
          <p class="text-xl font-medium text-gray-700 mb-6 uppercase tracking-tight">{{ founder.title }}</p>
          <div class="w-16 h-1 bg-gray-200"></div>
        </div>
      </div>

      <div class="flex flex-col md:flex-row-reverse items-center gap-16 mb-32">
        <div class="w-full md:w-1/2">
          <div class="relative shadow-2xl rounded-lg overflow-hidden border-b-8 border-amber-500">
            <img [src]="headmaster.image" [alt]="headmaster.name" class="w-full h-[500px] object-cover">
          </div>
        </div>
        <div class="w-full md:w-1/2">
          <h4 class="text-amber-500 text-3xl font-light mb-2">Master <span class="font-bold text-gray-900">{{ headmaster.name }}</span></h4>
          <p class="text-xl font-medium text-gray-700 uppercase tracking-tight">{{ headmaster.role }}</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-16 pt-16 border-t border-gray-100">
        @for (member of philippineLeadership; track member.name) {
          <div class="flex flex-col">
            <div class="relative shadow-xl rounded-lg overflow-hidden border-b-4 border-amber-500 mb-8">
              <img [src]="member.image" [alt]="member.name" class="w-full h-[450px] object-cover grayscale hover:grayscale-0 transition-all duration-700">
            </div>
            <h4 class="text-amber-500 text-2xl font-light">
              <span class="font-bold text-gray-900 uppercase tracking-tighter block text-4xl mt-1">{{ member.name }}</span>
            </h4>
            <p class="text-lg font-bold text-gray-500 uppercase tracking-widest mt-2">{{ member.role }}</p>
          </div>
        }
      </div>

    </div>
  </section>
</div>
